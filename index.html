<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIMMY HOST - GoldHEN</title>
    <style>
        body {
            background: #0f172a url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(15, 23, 42, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            border: 2px solid #38bdf8;
            max-width: 90%;
            width: 400px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 { margin: 10px 0; color: #38bdf8; font-size: 28px; }
        p { color: #cbd5e1; font-size: 18px; margin-bottom: 25px; }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #0369a1; transform: scale(1.03); }
        #status { margin-top: 15px; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <img src="profile.jpg" alt="JIMMY" class="profile-img">
        <h1>JIMMY HOST</h1>
        <p>كل اللي اتقال اشاعات مكرم وجيمي اخوات</p>
        <button class="btn" onclick="loadGoldHEN()">تفعيل GoldHEN</button>
        <div id="status"></div>
    </div>

    <script>
        function loadGoldHEN() {
            document.getElementById('status').innerText = 'جاري تفعيل الثغرة... انتظر قليلاً';
            setTimeout(() => {
                window.location.href = "goldhen.html";
            }, 1000);
        }
    </script>

</body>
</html>
